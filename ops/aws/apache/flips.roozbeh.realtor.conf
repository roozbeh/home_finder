<VirtualHost *:80>
    ServerName flips.roozbeh.realtor

    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    ErrorLog ${APACHE_LOG_DIR}/flips.roozbeh.realtor-error.log
    CustomLog ${APACHE_LOG_DIR}/flips.roozbeh.realtor-access.log combined
</VirtualHost>
