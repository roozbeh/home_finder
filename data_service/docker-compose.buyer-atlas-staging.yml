# Isolated loopback staging with the existing MLS policy and opaque URL key.
services:
  buyer-atlas-staging:
    build:
      context: ./flip_ui
    env_file:
      - ${BUYER_ATLAS_STAGING_ENV_FILE:-buyer-atlas-staging.env}
    ports:
      - "127.0.0.1:8092:5000"
    environment:
      BUYER_MODE: approved
      BUYER_ATLAS_STAGING: "true"
      BUYER_ATLAS_POLICY: /input/live-policy.json
      MONGO_URI: ""
    volumes:
      - ${BUYER_PUBLISH_INPUT_DIR:-./buyer-publication}:/input:ro
