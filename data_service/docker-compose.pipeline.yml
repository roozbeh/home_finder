services:
  # One-shot services invoked by the host systemd timer.  They intentionally do
  # not invoke get_cookies.py: credentials/bot checks must not be automated.
  mls_refresh_active:
    build:
      context: ./mls_service
      dockerfile: Dockerfile
    env_file: env
    environment:
      HEADLESS: "true"
      MLS_MAX_SESSION_AGE_HOURS: "12"
    command: ["python", "/app/search_and_store.py", "--active-only", "--market", "bay-area"]

  mls_fetch_new_active_details:
    build:
      context: ./mls_service
      dockerfile: Dockerfile
    env_file: env
    environment:
      HEADLESS: "true"
      MLS_MAX_SESSION_AGE_HOURS: "12"
    command: ["python", "/app/fetch_details.py", "--active-only", "--limit", "300"]

  flip_screen:
    build:
      context: ..
      dockerfile: flip_finder/Dockerfile
    env_file: env
    command: ["python", "-m", "flip_finder.daily", "--write"]
