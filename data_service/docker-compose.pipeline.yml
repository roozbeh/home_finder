services:
  # One-shot services invoked by the host systemd timer.  They intentionally do
  # not invoke get_cookies.py: credentials/bot checks must not be automated.
  mls_refresh_active:
    build:
      context: ./mls_service
      dockerfile: Dockerfile
    env_file: env
    environment:
      HEADLESS: "true"
      MLS_MAX_SESSION_AGE_HOURS: "12"
    # Required on the current AWS host's Docker 18.09 runtime, whose default
    # seccomp profile prevents Python 3.12 from creating worker threads.
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    command: ["python", "/app/search_and_store.py", "--active-only", "--market", "bay-area"]

  mls_fetch_new_active_details:
    build:
      context: ./mls_service
      dockerfile: Dockerfile
    env_file: env
    environment:
      HEADLESS: "true"
      MLS_MAX_SESSION_AGE_HOURS: "12"
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    command: ["python", "/app/fetch_details.py", "--active-only", "--limit", "300"]

  flip_screen:
    build:
      context: ..
      dockerfile: flip_finder/Dockerfile
    env_file: env
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    command: ["python", "-m", "flip_finder.daily", "--write"]

  # Once-daily, derived research dataset. This reads only mls.mls_listings and
  # writes observed short-hold resale pairs to flip_finder.flipdb.
  flip_detector_refresh:
    build:
      context: ..
      dockerfile: flip_finder/Dockerfile
    env_file: env
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    command: ["python", "-m", "flip_finder.flipdb", "--write"]
