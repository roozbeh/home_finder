services:

  # ── MongoDB (local) ─────────────────────────────────────────────────────────
  # Commented out — now using MongoDB Atlas (cloud).
  # Uncomment to run a local instance for testing/development.
  #
  # mongo:
  #   image: mongo:7
  #   container_name: mls_mongo
  #   restart: unless-stopped
  #   command: ["mongod", "--quiet", "--logpath", "/dev/null"]
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
  #     MONGO_INITDB_DATABASE: mls
  #   volumes:
  #     - mongo_data:/data/db
  #     - ./db:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # ── Scraper / importer (request-only; safe for AWS) ───────────────────────
  # The host cron invokes jobs in this container.  It never performs browser
  # login: it reuses a valid authorized session from MongoDB.
  app:
    build:
      context: ./mls_service
      dockerfile: Dockerfile
    container_name: mls_app
    restart: unless-stopped
    env_file:
      - env                      # MONGO_URI points to Atlas
    volumes:
      - app_data:/app/data

  # ── Manual MLS authentication (local only) ────────────────────────────────
  # This is opt-in (`--profile auth`) and must never be deployed on AWS.
  # It writes the authorized browser session to MongoDB for mls_app to reuse.
  auth_token:
    build:
      context: ./mls_service
      dockerfile: Dockerfile.auth_token
    container_name: auth_token
    profiles: ["auth"]
    env_file:
      - env
    environment:
      HEADLESS: "true"

  # ── Marketing content generator ───────────────────────────────────────────
  # Generates Reddit posts, Instagram captions, and blog post drafts using
  # live MLS data + Claude. Run on demand — does not stay up.
  #
  # Generate all content types:
  #   docker-compose run --rm marketing
  #
  # Generate one type:
  #   docker-compose run --rm marketing reddit
  #   docker-compose run --rm marketing instagram
  #   docker-compose run --rm marketing blog
  #
  # Output is saved to marketing/output/ on the host.
  marketing:
    build:
      context: ./marketing
      dockerfile: Dockerfile
    container_name: mls_marketing
    env_file:
      - env
    volumes:
      - ./marketing/output:/app/output   # drafts land here on the host

  # ── Flask web server (listings browser) ───────────────────────────────────
  web:
    build:
      context: .                 # data_service root — gives access to web/ AND agentic/
      dockerfile: web/Dockerfile
    container_name: mls_web
    restart: unless-stopped
    env_file:
      - env                      # MONGO_URI points to Atlas
    ports:
      - "8080:5000"         # home finder chat + listings browser → http://localhost:8080
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp=unconfined

  # Private visual review workspace for derived FlipDB records. Apache proxies
  # the loopback-only port at flips.roozbeh.realtor.
  flip_ui:
    build:
      context: ./flip_ui
      dockerfile: Dockerfile
    container_name: flip_ui
    restart: unless-stopped
    env_file:
      - env
    ports:
      - "127.0.0.1:8090:5000"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp=unconfined

volumes:
  # mongo_data:   # uncomment when re-enabling local mongo
  app_data:
