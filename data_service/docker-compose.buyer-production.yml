# Serve the approved MLS policy over the canonical listing collection.
services:
  buyer-public:
    container_name: flips_public
    build:
      context: ./flip_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BUYER_PUBLIC_PORT:-8091}:5000"
    env_file:
      - ${BUYER_PRODUCTION_ENV_FILE:?Set the restricted public Atlas environment file}
    environment:
      BUYER_ATLAS_POLICY: /input/live-policy.json
      BUYER_TRUST_PROXY: "true"
      FLIP_UI_COOKIE_SECURE: "true"
      MONGO_URI: ""
    volumes:
      - ${BUYER_PUBLISH_INPUT_DIR:?Set the approved MLS policy directory}:/input:ro
    security_opt:
      # The AWS host still runs Docker 18.09, which blocks PyMongo threads under its default profile.
      - seccomp=unconfined
      - no-new-privileges:true
