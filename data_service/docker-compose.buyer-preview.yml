# Review the same signed-out catalog that the deployed buyer service reads.
services:
  buyer-preview:
    container_name: flips_public
    build:
      context: ./flip_ui
    env_file:
      - path: ${BUYER_PRODUCTION_ENV_FILE:-buyer.env}
        required: false
    ports:
      - "127.0.0.1:8091:5000"
    environment:
      BUYER_MODE: approved
      BUYER_CATALOG: /catalog/catalog.sqlite
      BUYER_SUBMISSIONS: /private/submissions.sqlite
      MONGO_URI: ""
    volumes:
      - buyer-live-catalog:/catalog:ro
      - buyer-live-private:/private
    command:
      - sh
      - -ec
      - |
        umask 077
        test -s /private/session-secret || python -c 'import secrets; print(secrets.token_hex(32))' > /private/session-secret
        export FLIP_UI_SECRET_KEY=$$(cat /private/session-secret)
        exec gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 app:app

  buyer-live-publisher:
    build:
      context: ./flip_ui
    profiles: ["live-feed"]
    restart: unless-stopped
    env_file:
      - ${BUYER_MLS_PUBLISHER_ENV_FILE:-env}
    volumes:
      - buyer-live-catalog:/catalog
      - ${BUYER_PUBLISH_INPUT_DIR:-./buyer-publication}:/input:ro
    entrypoint: ["python", "-u", "-B", "buyer_live_feed.py"]
    command: ["--policy", "/input/live-policy.json", "--catalog", "/catalog/catalog.sqlite", "--assets", "/input/media", "--interval", "${BUYER_PUBLISH_INTERVAL:-900}"]
volumes:
  buyer-live-catalog:
  buyer-live-private:
