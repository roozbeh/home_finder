[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peninsula-flip-finder"
version = "0.1.0"
description = "Private, provenance-aware real-estate investment screening"
requires-python = ">=3.11"
dependencies = ["pymongo>=4.6"]

[project.scripts]
flip-finder = "flip_finder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
